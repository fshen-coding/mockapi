services:
  # Both stacks (this one and dpu-services) share a single Postgres so user
  # accounts and mock configuration stay in one place. The shared instance is
  # the dpu-services postgres published on the host as 54329; reaching it via
  # host.docker.internal works from any compose project's network.
  mockapi:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MOCKAPI_DATABASE_URL: postgresql://mockapi:mockapi@host.docker.internal:54329/mockapi
    volumes:
      - ./web/data:/app/web/data
    ports:
      - "8000:8000"
    networks:
      default: {}
      dpu-services:
        aliases:
          - mockapi
    restart: unless-stopped

  mockapi-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MOCKAPI_DATABASE_URL: postgresql://mockapi:mockapi@host.docker.internal:54329/mockapi
    volumes:
      - ./web/data:/app/web/data
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped

networks:
  dpu-services:
    external: true
    name: dpu-services_default
