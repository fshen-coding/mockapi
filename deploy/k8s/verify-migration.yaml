apiVersion: batch/v1
kind: Job
metadata:
  name: verify-migration-20260922
  namespace: mockapi
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: verify
          image: mockapi:20260922
          imagePullPolicy: Never
          command:
            - sh
            - -ec
            - python /verification/verify_database.py < /backup/manifest-20260922.json
          env:
            - name: MOCKAPI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: MOCKAPI_DATABASE_URL
          volumeMounts:
            - name: data
              mountPath: /app/web/data
              readOnly: true
            - name: verification
              mountPath: /verification
              readOnly: true
            - name: backup
              mountPath: /backup
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mockapi-data
        - name: verification
          configMap:
            name: migration-verification
        - name: backup
          hostPath:
            path: /opt/mockapi-backups
            type: Directory
