name: MockAPI CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, developer-fshen]
  workflow_dispatch:

concurrency:
  group: mockapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/fshen-coding/mockapi

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q web ./*.py

  image:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image
        shell: bash
        run: |
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          echo "value=${image}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            channel_tag="${IMAGE_NAME}:main"
          else
            channel_tag="${IMAGE_NAME}:sit"
          fi
          {
            echo "tags<<EOF"
            echo "$image"
            echo "$channel_tag"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/k8s/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy immutable image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy-mockapi $IMAGE"

  deploy-sit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/developer-fshen'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: sit
    concurrency:
      group: mockapi-deploy-sit
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy immutable image to SIT
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy-mockapi-sit $IMAGE"
